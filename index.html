// ─────────── Статус работы ───────────
// Время берётся в часовом поясе салона (company.timezone); если пояс не задан
// или браузер его не знает — время устройства.
const WEEKDAYS = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
let salonFormat; // undefined — ещё не создан, null — недоступен

function salonClock(date) {
  if (salonFormat === undefined) {
    salonFormat = null;
    if (company.timezone && typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
      try {
        salonFormat = new Intl.DateTimeFormat('en-US', {
          timeZone: company.timezone, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        });
        if (!salonFormat.formatToParts) salonFormat = null;
      } catch (e) { salonFormat = null; }
    }
  }
  if (salonFormat) {
    try {
      const p = {};
      salonFormat.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      const day = WEEKDAYS[p.weekday];
      const h = parseInt(p.hour, 10) % 24; // некоторые браузеры пишут полночь как «24»
      const m = parseInt(p.minute, 10);
      if (day && !isNaN(h) && !isNaN(m)) return { day: day, min: h * 60 + m };
    } catch (e) { /* ниже — время устройства */ }
  }
  return { day: date.getDay() || 7, min: date.getHours() * 60 + date.getMinutes() };
}

function toMinutes(hhmm) {
  const p = String(hhmm).split(':');
  return parseInt(p[0], 10) * 60 + parseInt(p[1] || '0', 10);
}

// ЧЧ:ММ из минут (для «24:00» тоже)
function formatTime(min) { return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }

const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const HHMM = /^\d{1,2}:\d{2}$/;
const SPECIAL_DAYS_AHEAD = 14; // особые даты в расписании и поиск ближайшего открытия

function timeMinutes(v) { return HHMM.test(String(v)) ? toMinutes(v) : NaN; }

// Часы одного дня в минутах: { open, close, brk: {from, to} | null } или null — выходной (или неверная запись)
function parseDay(d) {
  if (!d || d.closed) return null;
  const open = timeMinutes(d.open);
  const close = timeMinutes(d.close);
  if (isNaN(open) || isNaN(close) || close <= open || close > 1440) return null;
  const day = { open: open, close: close, brk: null };
  if (Array.isArray(d.break) && d.break.length === 2) {
    const from = timeMinutes(d.break[0]);
    const to = timeMinutes(d.break[1]);
    if (from > open && to > from && to < close) day.brk = { from: from, to: to };
  }
  return day;
}

// company.hours в общем виде: { week: [пн…вс], exceptions: { "ГГГГ-ММ-ДД": день | null } } или null.
// Новый формат — week/exceptions; старый — days/open/close (одинаковые часы в дни из days).
let salonHoursCache;

function salonHours() {
  if (salonHoursCache !== undefined) return salonHoursCache;
  salonHoursCache = null;
  const h = company.hours;
  if (!h) return null;
  const week = [];
  if (h.week) {
    DAY_KEYS.forEach(function (k) { week.push(parseDay(h.week[k])); });
  } else if (h.open && h.close) {
    const days = h.days || [1, 2, 3, 4, 5, 6, 7];
    for (let d = 1; d <= 7; d++) week.push(days.indexOf(d) !== -1 ? parseDay({ open: h.open, close: h.close }) : null);
  } else {
    return null;
  }
  const exceptions = {};
  (Array.isArray(h.exceptions) ? h.exceptions : []).forEach(function (x) {
    if (!x || !ISO_DATE.test(String(x.date))) return;
    const day = parseDay(x);
    if (day || x.closed) exceptions[x.date] = day;
  });
  salonHoursCache = { week: week, exceptions: exceptions };
  return salonHoursCache;
}

function isoToUTC(iso) {
  const p = iso.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
}

function addDays(iso, n) {
  const d = isoToUTC(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

// 1 = понедельник … 7 = воскресенье
function isoWeekday(iso) { return isoToUTC(iso).getUTCDay() || 7; }

// Часы на дату: особая дата, иначе обычный день недели
function daySchedule(hours, iso) {
  return Object.prototype.hasOwnProperty.call(hours.exceptions, iso) ? hours.exceptions[iso] : hours.week[isoWeekday(iso) - 1];
}

// { state: 'open' | 'break' | 'closed', text } или null (часы не заданы или открытия в ближайшие дни нет)
function workStatus(date) {
  const hours = salonHours();
  if (!hours) return null;
  const today = salonToday(date);
  const min = salonClock(date).min;
  const d = daySchedule(hours, today);
  if (d && min >= d.open && min < d.close) {
    if (d.brk && min >= d.brk.from && min < d.brk.to) {
      return { state: 'break', text: fill(t('breakUntil'), { time: formatTime(d.brk.to) }) };
    }
    if (d.brk && min < d.brk.from && d.brk.from - min <= 60) {
      return { state: 'open', text: fill(t('breakFrom'), { time: formatTime(d.brk.from) }) };
    }
    return { state: 'open', text: fill(t('openUntil'), { time: formatTime(d.close) }) };
  }
  if (d && min < d.open) return { state: 'closed', text: fill(t('closedOpensAt'), { time: formatTime(d.open) }) };
  for (let i = 1; i <= SPECIAL_DAYS_AHEAD; i++) {
    const iso = addDays(today, i);
    const next = daySchedule(hours, iso);
    if (!next) continue;
    if (i === 1) return { state: 'closed', text: fill(t('closedOpensTomorrow'), { time: formatTime(next.open) }) };
    return { state: 'closed', text: fill(t('closedOpensDay'), { day: t('daysOn')[isoWeekday(iso) - 1], time: formatTime(next.open) }) };
  }
  return null;
}

function paintStatus(node, status) {
  node.querySelector('.status-text').textContent = status.text;
  node.className = 'status is-' + status.state;
}

// «10:00–20:00» (+ строка перерыва) или «Выходной»
function dayHours(day) {
  const box = el('span', 'dtime');
  if (!day) {
    box.appendChild(el('span', 'off', t('dayOff')));
    return box;
  }
  box.appendChild(el('span', 'num', formatTime(day.open) + '–' + formatTime(day.close)));
  if (day.brk) box.appendChild(el('span', 'brk num', fill(t('breakTime'), { from: formatTime(day.brk.from), to: formatTime(day.brk.to) })));
  return box;
}

// Содержимое панели «Режим работы»: неделя (сегодня выделено) и особые даты в ближайшие 14 дней
function fillHoursPanel(panel, date) {
  const hours = salonHours();
  const today = salonToday(date);
  const todayDay = isoWeekday(today);
  panel.textContent = '';
  panel.appendChild(el('h2', null, t('schedule')));
  const week = el('ul', 'week');
  hours.week.forEach(function (day, i) {
    const li = el('li');
    if (i + 1 === todayDay) {
      li.className = 'is-today';
      li.setAttribute('aria-current', 'date');
    }
    li.appendChild(el('span', 'dname', t('daysShort')[i]));
    li.appendChild(dayHours(day));
    week.appendChild(li);
  });
  panel.appendChild(week);
  const last = addDays(today, SPECIAL_DAYS_AHEAD);
  const dates = Object.keys(hours.exceptions).filter(function (iso) { return iso >= today && iso <= last; }).sort();
  if (!dates.length) return;
  panel.appendChild(el('h3', null, t('specialDates')));
  const list = el('ul', 'special');
  dates.forEach(function (iso) {
    const li = el('li');
    if (iso === today) li.className = 'is-today';
    li.appendChild(el('span', 'dname num', formatDayMonth(iso) + ', ' + t('daysShort')[isoWeekday(iso) - 1]));
    li.appendChild(dayHours(hours.exceptions[iso]));
    list.appendChild(li);
  });
  panel.appendChild(list);
}

// Раскрыто ли расписание — только в памяти страницы (сохраняется при смене языка и «Назад»)
let hoursOpen = false;

// Статус-кнопка и панель расписания (null, если статуса нет)
function hoursBlock() {
  const now = new Date();
  const status = workStatus(now);
  if (!status) return null;
  const box = el('div', 'hours');
  const btn = el('button');
  btn.type = 'button';
  btn.setAttribute('aria-controls', 'hours-panel');
  btn.setAttribute('aria-expanded', hoursOpen ? 'true' : 'false');
  btn.appendChild(el('span', 'status-text'));
  btn.appendChild(svgNode(ICONS.down));
  paintStatus(btn, status);
  const panel = el('div', 'hours-panel');
  panel.id = 'hours-panel';
  panel.hidden = !hoursOpen;
  fillHoursPanel(panel, now);
  btn.addEventListener('click', function () {
    hoursOpen = !hoursOpen;
    btn.setAttribute('aria-expanded', hoursOpen ? 'true' : 'false');
    panel.hidden = !hoursOpen;
  });
  box.appendChild(btn);
  box.appendChild(panel);
  return box;
}

function refreshStatus() {
  const box = document.querySelector('.hours');
  if (!box) return;
  const now = new Date();
  const status = workStatus(now);
  if (status) paintStatus(box.querySelector('.status'), status);
  fillHoursPanel(box.querySelector('.hours-panel'), now);
}

// Обновление раз в минуту, в начале каждой минуты
function scheduleStatus() {
  refreshStatus();
  refreshPromos();
  setTimeout(scheduleStatus, 60000 - Date.now() % 60000 + 50);
}

// ─────────── Акции ───────────
// Акция действует, пока сегодняшняя дата салона (company.timezone) не позже promo.until.
// Неверно заполненная акция (цена не меньше обычной, дата не ГГГГ-ММ-ДД) просто не показывается.
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
let dateFormat; // undefined — ещё не создан, null — недоступен
let promoDay = ''; // дата (ГГГГ-ММ-ДД), по которой нарисован экран

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function salonToday(date) {
  if (dateFormat === undefined) {
    dateFormat = null;
    if (company.timezone && typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
      try {
        dateFormat = new Intl.DateTimeFormat('en-US', {
          timeZone: company.timezone, year: 'numeric', month: '2-digit', day: '2-digit'
        });
        if (!dateFormat.formatToParts) dateFormat = null;
      } catch (e) { dateFormat = null; }
    }
  }
  if (dateFormat) {
    try {
      const p = {};
      dateFormat.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      const iso = p.year + '-' + p.month + '-' + p.day;
      if (ISO_DATE.test(iso)) return iso;
    } catch (e) { /* ниже — дата устройства */ }
  }
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

// Варианты цены услуги (непустой массив, у каждого числовая amount) или null
function itemVariants(item) {
  const v = item.variants;
  if (!Array.isArray(v) || !v.length) return null;
  for (let i = 0; i < v.length; i++) {
    if (!v[i] || typeof v[i].amount !== 'number' || !(v[i].amount >= 0)) return null;
  }
  return v;
}

function minVariantAmount(variants) {
  return Math.min.apply(null, variants.map(function (v) { return v.amount; }));
}

// Действующая акция услуги или null (с вариантами цены акция не действует)
function activePromo(item) {
  if (itemVariants(item)) return null;
  const p = item.promo;
  if (!p || typeof p.amount !== 'number' || !(p.amount >= 0) || !(p.amount < item.price.amount)) return null;
  if (!ISO_DATE.test(String(p.until)) || promoDay > p.until) return null;
  return p;
}

// Цена с учётом акции: from и per — от обычной цены.
// С вариантами — «от <минимальный вариант>».
function effectivePrice(item) {
  const variants = itemVariants(item);
  if (variants) return { amount: minVariantAmount(variants), from: true, per: item.price.per };
  const p = activePromo(item);
  return p ? { amount: p.amount, from: item.price.from, per: item.price.per } : item.price;
}

function discountPercent(item, p) {
  return Math.round((item.price.amount - p.amount) / item.price.amount * 100);
}

function formatSaving(item, p) {
  let s = formatAmount(item.price.amount - p.amount);
  if (item.price.per) s += t('perPrefix') + loc(item.price.per);
  return s;
}

// Все действующие акции по порядку прайса
function activePromos() {
  const list = [];
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      const p = activePromo(item);
      if (p) list.push({ cat: cat, item: item, promo: p });
    });
  });
  return list;
}

function promoKey() {
  return activePromos().map(function (r) { return r.item.id; }).join(',');
}

// Наступил новый день и какая-то акция закончилась — перерисовать экран на месте
function refreshPromos() {
  const day = salonToday(new Date());
  if (day === promoDay) return;
  const before = promoKey();
  promoDay = day;
  if (currentRoute && promoKey() !== before) redraw();
}

// ─────────── Поиск ───────────
let searchQuery = '';

function normalize(s) {
  return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
}

// Сначала совпадения в названии услуги, потом в названии категории, потом в описании
function searchItems(query) {
  const q = normalize(query);
  if (!q) return [];
  const groups = [[], [], []];
  priceData.categories.forEach(function (cat) {
    const inCat = normalize(loc(cat.name)).indexOf(q) !== -1;
    cat.items.forEach(function (item) {
      let g = -1;
      if (normalize(loc(item.name)).indexOf(q) !== -1) g = 0;
      else if (inCat) g = 1;
      else if (item.desc && normalize(loc(item.desc)).indexOf(q) !== -1) g = 2;
      if (g !== -1) groups[g].push({ cat: cat, item: item });
    });
  });
  return groups[0].concat(groups[1], groups[2]);
}

// ─────────── Построение DOM ───────────
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function externalLink(className, href) {
  const a = el('a', className);
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

// SVG берётся только из кода (ILLUSTRATIONS / ICONS), не из данных
function svgNode(markup) {
  const box = document.createElement('div');
  box.innerHTML = markup;
  return box.firstChild;
}

function illustration(key, className) {
  const box = el('div', 'ill ' + className);
  box.innerHTML = Object.prototype.hasOwnProperty.call(ILLUSTRATIONS, key) ? ILLUSTRATIONS[key] : ILL_PLACEHOLDER;
  return box;
}

function circleIcon(name, extra) {
  const span = el('span', 'circle' + (extra ? ' ' + extra : ''));
  span.innerHTML = ICONS[name];
  return span;
}

// Элемент появляется по очереди с соседями
function stagger(node, i) {
  node.classList.add('stagger');
  node.style.setProperty('--i', i);
  return node;
}

function hitBadge() { return el('span', 'hit', t('hit')); }

function durationLabel(minutes) {
  const span = el('span', 'dur');
  span.appendChild(svgNode(ICONS.clock));
  span.appendChild(el('span', 'num', formatDuration(minutes)));
  return span;
}

function backLink(href, parentKey, text) {
  const a = el('a', 'back');
  a.href = href;
  a.appendChild(svgNode(ICONS.back));
  a.appendChild(el('span', null, text));
  a.addEventListener('click', function (e) {
    // Если предыдущий экран в истории — этот же родитель, просто шаг назад
    if (routeKeys[currentIdx - 1] === parentKey) {
      e.preventDefault();
      history.back();
    }
  });
  return a;
}

function ornament() {
  const o = el('div', 'ornament');
  o.setAttribute('aria-hidden', 'true');
  o.appendChild(el('span'));
  return o;
}

function discountBadge(item, p) {
  return el('span', 'promo-badge num', MINUS + discountPercent(item, p) + '%');
}

// Зачёркнутая старая цена (только сумма: «от» и « / ноготь» есть у новой цены рядом)
function oldPrice(item) {
  const text = formatAmount(item.price.amount);
  const del = el('del', 'old num', text);
  del.setAttribute('aria-label', t('oldPrice') + ' ' + text);
  return del;
}

// Новая цена и под ней старая
function promoPrice(item, className) {
  const box = el('div', className);
  box.appendChild(el('span', 'new', formatPrice(effectivePrice(item))));
  box.appendChild(oldPrice(item));
  return box;
}

// Строка услуги: в списке категории — длительность и «Хит», в поиске — название категории
function serviceRow(cat, item, withCategory) {
  const promo = activePromo(item);
  const row = el('a', 'row');
  row.href = itemHash(cat, item);
  row.appendChild(illustration(item.illustration, 'ill-mini'));
  const info = el('div', 'info');
  info.appendChild(el('div', 'name', loc(item.name)));
  if (withCategory) {
    info.appendChild(el('div', 'cat', loc(cat.name)));
    if (promo) {
      const meta = el('div', 'meta');
      meta.appendChild(discountBadge(item, promo));
      info.appendChild(meta);
    }
  } else if (item.duration || item.hit || promo) {
    const meta = el('div', 'meta');
    if (item.duration) meta.appendChild(durationLabel(item.duration));
    if (item.hit) meta.appendChild(hitBadge());
    if (promo) meta.appendChild(discountBadge(item, promo));
    info.appendChild(meta);
  }
  row.appendChild(info);
  if (promo) row.appendChild(promoPrice(item, 'price num is-promo'));
  else row.appendChild(el('div', 'price num', formatPrice(effectivePrice(item))));
  row.appendChild(svgNode(ICONS.chev));
  return row;
}

// ─────────── Варианты цены ───────────
// Выбранный вариант (номер в массиве) по ключу «категория/услуга» — только в памяти страницы:
// сохраняется при смене языка и «Назад», после перезагрузки ничего не выбрано
const chosenVariants = {};

// Цена варианта: «6 000 ₸» (+ « / ноготь», если у услуги есть per)
function variantPrice(item, v) {
  let s = formatAmount(v.amount);
  if (item.price.per) s += t('perPrefix') + loc(item.price.per);
  return s;
}

// Ссылка записи: вариант выбран → шаблон с вариантом; акция → шаблон акции; иначе обычный
function bookLink(item, promo, variant) {
  if (variant) {
    return waLink(fill(t('waTemplateVariant'), {
      name: loc(item.name),
      variant: loc(variant.name),
      price: variantPrice(item, variant)
    }));
  }
  return waLink(fill(t(promo ? 'waTemplatePromo' : 'waTemplate'), {
    name: loc(item.name),
    price: formatPrice(effectivePrice(item))
  }));
}

// Ссылка онлайн-записи: своя у категории приоритетнее общей; только http/https, иначе ссылки нет
function httpUrl(u) { return typeof u === 'string' && /^https?:\/\/\S+$/i.test(u.trim()) ? u.trim() : ''; }

function bookingUrl(cat) {
  return httpUrl(cat.bookingUrl) || httpUrl(company.booking && company.booking.url);
}

function bookingLabel() {
  const label = company.booking && company.booking.label;
  return (label && loc(label)) || t('bookOnline');
}

// Таблица вариантов с выбором (радиокнопки, по умолчанию ничего не выбрано)
function variantsBlock(cat, item, variants, chosen, onChoose) {
  const box = el('fieldset', 'variants');
  box.appendChild(el('legend', null, t('variantsTitle')));
  const hint = el('p', 'hint', t('chooseVariant'));
  hint.id = 'vh-' + cat.id + '-' + item.id;
  box.setAttribute('aria-describedby', hint.id);
  box.appendChild(hint);
  const opts = el('div', 'opts');
  const labels = [];
  variants.forEach(function (v) {
    const label = el('label', 'opt');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'variant-' + cat.id + '-' + item.id;
    input.checked = v === chosen;
    if (input.checked) label.classList.add('is-checked');
    input.addEventListener('change', function () {
      if (!input.checked) return;
      labels.forEach(function (l) { l.classList.toggle('is-checked', l === label); });
      onChoose(v);
    });
    label.appendChild(input);
    label.appendChild(el('span', 'vname', loc(v.name)));
    label.appendChild(el('span', 'vprice num', variantPrice(item, v)));
    labels.push(label);
    opts.appendChild(label);
  });
  box.appendChild(opts);
  return box;
}

// Лента акций на главной (null, если действующих акций нет)
function promoStrip() {
  const promos = activePromos();
  if (!promos.length) return null;
  const section = el('section', 'promos');
  section.appendChild(el('h2', 'section-title', t('promosTitle')));
  const strip = el('div', 'promo-strip');
  promos.forEach(function (r, i) {
    const card = stagger(el('a', 'promo-card'), i);
    card.href = itemHash(r.cat, r.item);
    card.appendChild(illustration(r.item.illustration, 'ill-tile'));
    card.appendChild(discountBadge(r.item, r.promo));
    const body = el('div', 'body');
    body.appendChild(el('div', 'name', loc(r.item.name)));
    body.appendChild(promoPrice(r.item, 'price num'));
    card.appendChild(body);
    strip.appendChild(card);
  });
  section.appendChild(strip);
  return section;
}

// Перерисовывает только результаты, поле ввода не трогает (фокус и клавиатура остаются)
function showSearch(parts) {
  const active = normalize(searchQuery) !== '';
  parts.clear.hidden = searchQuery === '';
  parts.browse.hidden = active;
  parts.results.textContent = '';
  parts.empty.textContent = '';
  if (!active) return;
  const found = searchItems(searchQuery);
  if (!found.length) {
    parts.empty.textContent = t('nothingFound');
    return;
  }
  const list = el('ul', 'list');
  found.forEach(function (r) {
    const li = el('li');
    li.appendChild(serviceRow(r.cat, r.item, true));
    list.appendChild(li);
  });
  parts.results.appendChild(list);
}

function renderHome(screen) {
  const top = el('div', 'topbar');
  const switcher = el('div', 'lang');
  switcher.setAttribute('role', 'group');
  LANGS.forEach(function (code) {
    const b = el('button', null, priceData.ui[code].langLabel);
    b.type = 'button';
    b.lang = code;
    b.setAttribute('aria-pressed', code === lang ? 'true' : 'false');
    b.addEventListener('click', function () { setLang(code); });
    switcher.appendChild(b);
  });
  const tools = el('div', 'tools');
  tools.appendChild(iconButton('share', 'share-home', t('share'), function () { shareLink(null, null); }));
  tools.appendChild(iconButton('qr', 'qr-btn', t('showQr'), function () { openQr(this); }));
  top.appendChild(tools);
  top.appendChild(switcher);
  screen.appendChild(top);

  const hero = el('header', 'hero');
  const heroTop = el('div', 'hero-top');
  const sprigL = svgNode(SPRIG);
  sprigL.classList.add('sprig-l');
  const sprigR = svgNode(SPRIG);
  sprigR.classList.add('sprig-r');
  const mono = el('div', 'mono');
  mono.innerHTML = ILLUSTRATIONS.logo;
  heroTop.appendChild(sprigL);
  heroTop.appendChild(mono);
  heroTop.appendChild(sprigR);
  hero.appendChild(heroTop);
  hero.appendChild(el('h1', 'salon', company.name));
  hero.appendChild(el('p', 'sub', loc(company.subtitle)));
  hero.appendChild(ornament());
  const addr = el('p', 'addr');
  addr.appendChild(svgNode(ICONS.pin));
  addr.appendChild(el('span', null, loc(company.address)));
  hero.appendChild(addr);
  const hoursBox = hoursBlock();
  if (hoursBox) hero.appendChild(hoursBox);
  screen.appendChild(hero);

  const actions = el('nav', 'actions');
  const wa = externalLink('action', waLink(t('waGreeting')));
  wa.appendChild(circleIcon('whatsapp', 'wa'));
  wa.appendChild(el('span', null, t('actionWhatsapp')));
  const call = el('a', 'action');
  call.href = telLink();
  call.appendChild(circleIcon('call'));
  call.appendChild(el('span', null, t('actionCall')));
  const route = externalLink('action', company.mapLink);
  route.appendChild(circleIcon('route'));
  route.appendChild(el('span', null, t('actionRoute')));
  actions.appendChild(wa);
  actions.appendChild(call);
  actions.appendChild(route);
  screen.appendChild(actions);

  // Поиск: пока в поле есть текст, вместо категорий показываются результаты
  const search = el('div', 'search');
  search.setAttribute('role', 'search');
  search.appendChild(svgNode(ICONS.search));
  const input = el('input');
  input.type = 'search';
  input.placeholder = t('searchPlaceholder');
  input.setAttribute('aria-label', t('searchPlaceholder'));
  input.setAttribute('enterkeyhint', 'search');
  input.setAttribute('autocomplete', 'off');
  input.spellcheck = false;
  input.value = searchQuery;
  const clear = el('button', 'search-clear');
  clear.type = 'button';
  clear.setAttribute('aria-label', t('searchClear'));
  clear.appendChild(svgNode(ICONS.close));
  search.appendChild(input);
  search.appendChild(clear);
  screen.appendChild(search);

  const results = el('div', 'results');
  const empty = el('p', 'empty');
  empty.setAttribute('aria-live', 'polite');
  const browse = el('div', 'browse');
  screen.appendChild(results);
  screen.appendChild(empty);
  screen.appendChild(browse);
  const parts = { clear: clear, results: results, empty: empty, browse: browse };

  input.addEventListener('input', function () {
    searchQuery = input.value;
    showSearch(parts);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') input.blur(); // спрятать клавиатуру
  });
  clear.addEventListener('click', function () {
    input.value = '';
    searchQuery = '';
    showSearch(parts);
    input.focus();
  });

  const promos = promoStrip();
  if (promos) browse.appendChild(promos);
  browse.appendChild(el('h2', 'section-title', t('categories')));
  const grid = el('div', 'grid');
  priceData.categories.forEach(function (cat, i) {
    const card = stagger(el('a', 'cat-card'), i);
    card.href = catHash(cat);
    card.appendChild(illustration(cat.illustration, 'ill-tile'));
    if (cat.items.some(activePromo)) card.appendChild(el('span', 'promo-tag', t('promo')));
    const body = el('div', 'body');
    body.appendChild(el('div', 'name', loc(cat.name)));
    body.appendChild(el('div', 'count', formatCount(cat.items.length)));
    card.appendChild(body);
    grid.appendChild(card);
  });
  browse.appendChild(grid);
  showSearch(parts);

  const footer = el('footer', 'footer');
  footer.appendChild(ornament());
  const inner = el('div', 'footer-inner');
  inner.appendChild(el('p', 'disclaimer', t('disclaimer')));
  inner.appendChild(el('p', 'num', fill(t('updatedAt'), { date: formatDate(priceData.meta.updatedAt) })));
  const insta = externalLink('insta', company.instagram);
  insta.appendChild(svgNode(ICONS.instagram));
  insta.appendChild(el('span', null, t('instagram')));
  inner.appendChild(insta);
  if (!company.instagram) inner.removeChild(insta); // у салона нет Instagram
  inner.appendChild(el('p', 'copy', '© ' + new Date().getFullYear() + ' ' + company.name));
  footer.appendChild(inner);
  screen.appendChild(footer);

  document.title = company.name;
}

function renderCategory(screen, cat) {
  screen.appendChild(backLink('#/', 'home', t('categories')));

  const head = el('header', 'screen-head');
  head.appendChild(illustration(cat.illustration, 'ill-big'));
  head.appendChild(el('h1', null, loc(cat.name)));
  head.appendChild(el('p', 'from num', fill(t('priceFrom'), { price: formatAmount(minAmount(cat)) })));
  screen.appendChild(head);

  // Подряд идущие услуги с одинаковым group — свой список под заголовком раздела;
  // без group — список без заголовка (категория без разделов — один список, как раньше)
  let list = null;
  let group = null;
  cat.items.forEach(function (item, i) {
    const g = item.group ? loc(item.group) : '';
    if (!list || g !== group) {
      if (list) screen.appendChild(list);
      if (g) screen.appendChild(stagger(el('h2', 'group-title', g), i));
      list = el('ul', 'list');
      group = g;
    }
    const li = stagger(el('li'), i);
    li.appendChild(serviceRow(cat, item, false));
    list.appendChild(li);
  });
  if (list) screen.appendChild(list);

  document.title = loc(cat.name) + ' · ' + company.name;
}

function renderItem(screen, cat, item, app) {
  screen.classList.add('screen-item');
  screen.appendChild(backLink(catHash(cat), 'c/' + cat.id, loc(cat.name)));
  screen.appendChild(iconButton('share', 'share-item', t('share'), function () { shareLink(cat, item); }));

  const card = el('article', 'card');
  card.appendChild(illustration(item.illustration, 'ill-hero draw'));
  const body = el('div', 'card-body');
  body.appendChild(el('h1', null, loc(item.name)));
  const promo = activePromo(item);
  if (promo) {
    const prices = el('div', 'price-promo');
    prices.appendChild(el('p', 'price-big num', formatPrice(effectivePrice(item))));
    prices.appendChild(oldPrice(item));
    body.appendChild(prices);
    const info = el('p', 'promo-info');
    info.appendChild(el('span', 'promo-tag num', t('promo') + ' ' + fill(t('promoUntil'), { date: formatDayMonth(promo.until) })));
    info.appendChild(el('span', 'save num', fill(t('promoSave'), { sum: formatSaving(item, promo) })));
    body.appendChild(info);
  }
  const variants = itemVariants(item);
  const key = cat.id + '/' + item.id;
  const chosen = variants ? variants[chosenVariants[key]] || null : null;
  let priceBig = null;
  if (!promo) {
    priceBig = el('p', 'price-big num', chosen ? variantPrice(item, chosen) : formatPrice(effectivePrice(item)));
    body.appendChild(priceBig);
  }
  if (item.duration || item.hit) {
    const meta = el('p', 'meta');
    if (item.duration) meta.appendChild(durationLabel(item.duration));
    if (item.hit) meta.appendChild(hitBadge());
    body.appendChild(meta);
  }
  if (variants) {
    body.appendChild(variantsBlock(cat, item, variants, chosen, function (v) {
      chosenVariants[key] = variants.indexOf(v);
      // Без перерисовки экрана: только крупная цена и ссылка записи
      priceBig.textContent = variantPrice(item, v);
      book.href = bookLink(item, null, v);
    }));
  }
  if (item.desc && loc(item.desc)) body.appendChild(el('p', 'desc', loc(item.desc)));
  const includes = item.includes ? loc(item.includes) : null;
  if (includes && includes.length) {
    body.appendChild(el('h2', null, t('includes')));
    const ul = el('ul', 'checks');
    includes.forEach(function (text) { ul.appendChild(el('li', null, text)); });
    body.appendChild(ul);
  }
  card.appendChild(body);
  screen.appendChild(card);

  // Кнопка записи — вне анимируемого экрана, чтобы transform её не сдвигал
  // Есть ссылка онлайн-записи — главная кнопка «Записаться онлайн», WhatsApp — второй кнопкой
  const online = bookingUrl(cat);
  const bar = el('div', online ? 'book-bar has-booking' : 'book-bar');
  let book;
  if (online) {
    screen.classList.add('has-booking');
    const main = externalLink('btn-book', online);
    main.appendChild(svgNode(ICONS.calendar));
    main.appendChild(el('span', null, bookingLabel()));
    bar.appendChild(main);
    book = externalLink('btn-wa', bookLink(item, promo, chosen));
    book.appendChild(svgNode(ICONS.whatsapp));
    book.appendChild(el('span', null, t('writeWhatsapp')));
  } else {
    book = externalLink('btn-book', bookLink(item, promo, chosen));
    book.appendChild(svgNode(ICONS.whatsapp));
    book.appendChild(el('span', null, t('book')));
  }
  bar.appendChild(book);
  app.appendChild(bar);

  document.title = loc(item.name) + ' · ' + company.name;
}

// ─────────── «Поделиться» ───────────
// Кнопка-иконка: подпись для диктора и подсказка — из ui
function iconButton(icon, className, label, onClick) {
  const b = el('button', 'icon-btn ' + className);
  b.type = 'button';
  b.setAttribute('aria-label', label);
  b.title = label;
  b.appendChild(svgNode(ICONS[icon]));
  b.addEventListener('click', onClick);
  return b;
}

// Ссылка всегда на сайт (и при открытии файлом), с меткой источника; из карточки — прямо на услугу
function shareUrl(cat, item) {
  return priceData.meta.siteUrl + '?src=share' + (item ? itemHash(cat, item) : '');
}

// Системное меню → копирование в буфер (+ уведомление) → WhatsApp
function shareLink(cat, item) {
  const url = shareUrl(cat, item);
  const text = fill(t('shareText'), { name: company.name });
  if (navigator.share) {
    navigator.share({ title: document.title, text: text, url: url }).catch(function (e) {
      if (e && e.name === 'AbortError') return; // человек закрыл меню
      copyLink(url, text);
    });
    return;
  }
  copyLink(url, text);
}

function copyLink(url, text) {
  function legacy() {
    if (legacyCopy(url)) showToast(t('linkCopied'));
    else window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank', 'noopener');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast(t('linkCopied')); }, legacy);
      return;
    }
  } catch (e) { /* ниже — запасной способ */ }
  legacy();
}

// Старый способ копирования (браузеры без navigator.clipboard)
function legacyCopy(value) {
  const area = el('textarea');
  area.value = value;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(area);
  let ok = false;
  try {
    area.select();
    area.setSelectionRange(0, value.length);
    ok = document.execCommand('copy');
  } catch (e) { ok = false; }
  document.body.removeChild(area);
  return ok;
}

let toastTimer = null;
function showToast(text) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = el('div', 'toast');
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
    toast.offsetWidth; // чтобы появление было плавным
  }
  toast.textContent = text;
  toast.classList.toggle('is-above-bar', !!document.querySelector('.book-bar'));
  toast.classList.toggle('has-booking', !!document.querySelector('.book-bar.has-booking'));
  toast.classList.add('is-shown');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('is-shown'); }, 2000);
}

// ─────────── Окно «QR-код» ───────────
// Открытие добавляет запись в историю (адрес тот же) — системная «Назад» закрывает окно.
let qrModal = null;
let qrOpener = null;

function openQr(opener) {
  if (qrModal) return;
  qrOpener = opener;
  const modal = el('div', 'qr-modal');
  const dialog = el('div', 'qr-dialog');
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('aria-labelledby', 'qr-title');
  dialog.setAttribute('aria-describedby', 'qr-hint');
  const close = iconButton('close', 'qr-close', t('close'), function () { closeQr(); });
  const box = el('div', 'qr-box');
  box.appendChild(svgNode(QR_SVG));
  const name = el('p', 'qr-name', company.name);
  name.id = 'qr-title';
  const hint = el('p', 'qr-hint', t('qrHint'));
  hint.id = 'qr-hint';
  dialog.appendChild(close);
  dialog.appendChild(box);
  dialog.appendChild(name);
  dialog.appendChild(hint);
  modal.appendChild(dialog);
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeQr(); // нажатие на фон
  });
  modal.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      closeQr();
    } else if (e.key === 'Tab') {
      // Фокус не выходит из окна
      const items = dialog.querySelectorAll('button, [href]');
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    }
  });
  document.body.appendChild(modal);
  qrModal = modal;
  document.getElementById('app').setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = 'hidden';
  try { history.pushState({ idx: currentIdx, qr: true }, ''); } catch (e) { /* без записи «Назад» не закроет окно */ }
  close.focus();
}

// fromHistory — окно закрыла системная «Назад» (запись истории уже снята)
function closeQr(fromHistory) {
  if (!qrModal) return;
  if (!fromHistory && history.state && history.state.qr) {
    history.back(); // окно закроется в обработчике popstate
    return;
  }
  qrModal.parentNode.removeChild(qrModal);
  qrModal = null;
  document.getElementById('app').removeAttribute('aria-hidden');
  document.documentElement.style.overflow = '';
  // Экран могли перерисовать (смена дня) — тогда фокус на новую кнопку
  const target = qrOpener && document.contains(qrOpener) ? qrOpener : document.querySelector('.qr-btn');
  qrOpener = null;
  if (target) target.focus({ preventScroll: true });
}

function onPopState() {
  if (qrModal && !(history.state && history.state.qr)) closeQr(true);
}

// Фокус ушёл за пределы открытого окна (например, кликом) — вернуть в окно
function keepFocusInQr(e) {
  if (qrModal && !qrModal.contains(e.target)) {
    const close = qrModal.querySelector('.qr-close');
    if (close) close.focus();
  }
}

// ─────────── Маршрутизация ───────────
// #/ — главная, #/c/<catId> — категория, #/s/<catId>/<itemId> — услуга
function findById(list, id) {
  for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

function parseRoute(hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(safeDecode);
  if (parts.length === 0) return { screen: 'home', key: 'home' };
  if (parts[0] === 'c' && parts.length === 2) {
    const cat = findById(priceData.categories, parts[1]);
    if (cat) return { screen: 'cat', key: 'c/' + cat.id, cat: cat };
  }
  if (parts[0] === 's' && parts.length === 3) {
    const cat = findById(priceData.categories, parts[1]);
    const item = cat ? findById(cat.items, parts[2]) : null;
    if (item) return { screen: 'item', key: 's/' + cat.id + '/' + item.id, cat: cat, item: item };
  }
  return null;
}

// Номер записи истории хранится в history.state.idx:
// меньше текущего — это «назад» (восстановить прокрутку), иначе — «вперёд» (наверх).
let currentIdx = 0;
let currentRoute = null;
const scrollPositions = {};
const routeKeys = {};

// direction: 'fwd' | 'back' | null (без анимации экрана, например смена языка)
function render(route, direction) {
  const app = document.getElementById('app');
  app.textContent = '';
  const screen = el('div', 'screen');
  app.appendChild(screen);
  if (route.screen === 'cat') renderCategory(screen, route.cat);
  else if (route.screen === 'item') renderItem(screen, route.cat, route.item, app);
  else renderHome(screen);

  if (direction) {
    screen.classList.add(direction === 'back' ? 'enter-back' : 'enter-fwd');
    // После въезда снимаем класс, чтобы на экране не оставалось transform
    screen.addEventListener('animationend', function done(e) {
      if (e.target !== screen) return;
      screen.classList.remove('enter-fwd', 'enter-back');
      screen.removeEventListener('animationend', done);
    });
  } else {
    // Без анимации экрана — и без поочерёдного появления элементов
    const items = screen.querySelectorAll('.stagger');
    for (let i = 0; i < items.length; i++) items[i].classList.remove('stagger');
    const drawn = screen.querySelector('.draw');
    if (drawn) drawn.classList.remove('draw');
    const bar = app.querySelector('.book-bar');
    if (bar) bar.style.animation = 'none';
  }
}

function onRoute() {
  let route = parseRoute(location.hash);
  const unknown = !route;
  if (unknown) route = { screen: 'home', key: 'home' };

  const state = history.state;
  let idx;
  let isBack = false;
  if (state && typeof state.idx === 'number') {
    idx = state.idx;
    isBack = idx < currentIdx;
  } else {
    idx = currentIdx + 1;
  }
  // Неизвестный адрес → главная, без лишней записи в истории
  if (unknown) history.replaceState({ idx: idx }, '', '#/');
  else history.replaceState({ idx: idx }, '');

  currentIdx = idx;
  currentRoute = route;
  routeKeys[idx] = route.key;
  render(route, isBack ? 'back' : 'fwd');
  window.scrollTo(0, isBack ? (scrollPositions[idx] || 0) : 0);
}

// Перерисовать текущий экран на месте: без анимации, прокрутка сохраняется
function redraw() {
  const y = window.pageYOffset;
  const inSearch = document.activeElement && document.activeElement.type === 'search';
  render(currentRoute, null);
  window.scrollTo(0, y);
  if (inSearch) {
    const input = document.querySelector('.search input');
    if (input) input.focus({ preventScroll: true });
  }
}

function setLang(code) {
  if (code === lang) return;
  lang = code;
  saveLang(code);
  document.documentElement.lang = code;
  const hadFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.lang');
  redraw();
  if (hadFocus) {
    const btn = document.querySelector('.lang button[lang="' + code + '"]');
    if (btn) btn.focus({ preventScroll: true });
  }
}

// ─────────── PWA: только на сайте (http/https) ───────────
// Manifest и значок подключаются отсюда, а не в <head>: при открытии файлом (file://)
// браузер не может их прочитать и пишет ошибку в консоль.
function setupPwa() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    const links = [['manifest', 'manifest.webmanifest'], ['icon', 'icons/icon-192.png']];
    links.forEach(function (l) {
      const link = document.createElement('link');
      link.rel = l[0];
      link.href = l[1];
      document.head.appendChild(link);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  } catch (e) { /* без PWA прайс работает как обычная страница */ }
}

// promo и variants в одной услуге не поддерживаются: действует только variants
// (сообщение для того, кто правит данные; на экране ошибки нет)
function warnPromoWithVariants() {
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      if (item.promo && itemVariants(item) && window.console) {
        console.warn('priceData: услуга "' + item.id + '" — указаны и promo, и variants; promo не действует.');
      }
    });
  });
}

function init() {
  applyTheme();
  setupPwa();
  document.documentElement.lang = lang;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.addEventListener('scroll', function () {
    scrollPositions[currentIdx] = window.pageYOffset;
  }, { passive: true });
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('popstate', onPopState);
  document.addEventListener('focusin', keepFocusInQr);
  // Страницу перезагрузили с открытым окном QR — убрать лишнюю запись истории
  if (history.state && history.state.qr) history.back();
  promoDay = salonToday(new Date());
  warnPromoWithVariants();
  onRoute();
  scheduleStatus();
  // Телефон мог «спать» — при возврате на вкладку сразу обновить статус и акции
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      refreshStatus();
      refreshPromos();
    }
  });
}

const DELIVERY = priceData.meta.delivery || { min: 0, fee: 0, pickup: false };
const CART_KEY = LANG_KEY.replace(/lang$/, 'cart');
const ORDER_KEY = LANG_KEY.replace(/lang$/, 'order');
const CART_MAX = 99;

ICONS.plus = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5v13M5.5 12h13"/></svg>';
ICONS.minus = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 12h13"/></svg>';
ICONS.cart = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 8.5h14l-1.1 10.6a2 2 0 0 1-2 1.9H8.1a2 2 0 0 1-2-1.9z"/><path d="M9 11V7.5a3 3 0 0 1 6 0V11"/></svg>';
ICONS.trash = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13M10.5 10.5v6M13.5 10.5v6"/></svg>';

// Хранилище — только в try/catch: недоступно — корзина живёт в памяти страницы
function storeGet(key) {
  try {
    const s = window.localStorage.getItem(key);
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}

function storeSet(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* хранилище недоступно */ }
}

// ─────────── Корзина ───────────
// Строка корзины: { c: категория, i: блюдо, v: вариант ('' — без вариантов), q: количество }.
// Цены не хранятся — всегда берутся из текущего меню; позиции, которых больше нет в меню, пропадают.
function sameLine(a, b) { return a.c === b.c && a.i === b.i && (a.v || '') === (b.v || ''); }

function lineKey(l) { return l.c + '/' + l.i + '/' + (l.v || ''); }

function resolveLine(l) {
  const cat = findById(priceData.categories, l.c);
  const item = cat ? findById(cat.items, l.i) : null;
  if (!item) return null;
  const variants = itemVariants(item);
  if (!variants) return l.v ? null : { cat: cat, item: item, variant: null };
  for (let k = 0; k < variants.length; k++) {
    if (String(variants[k].id) === l.v) return { cat: cat, item: item, variant: variants[k] };
  }
  return null;
}

function loadCart() {
  const raw = storeGet(CART_KEY);
  const out = [];
  if (raw && Array.isArray(raw.lines)) {
    raw.lines.forEach(function (l) {
      if (!l || typeof l.c !== 'string' || typeof l.i !== 'string' || typeof l.q !== 'number' || !(l.q >= 1)) return;
      const line = { c: l.c, i: l.i, v: typeof l.v === 'string' ? l.v : '', q: Math.min(CART_MAX, Math.round(l.q)) };
      if (!resolveLine(line) || out.some(function (x) { return sameLine(x, line); })) return;
      out.push(line);
    });
  }
  return out;
}

let cart = loadCart();

function saveCart() { storeSet(CART_KEY, { lines: cart }); }

function qtyOf(l) {
  for (let k = 0; k < cart.length; k++) if (sameLine(cart[k], l)) return cart[k].q;
  return 0;
}

// Строки корзины вместе с блюдами: [{ l, r: { cat, item, variant } }]
function cartLines() {
  const out = [];
  cart.forEach(function (l) {
    const r = resolveLine(l);
    if (r) out.push({ l: l, r: r });
  });
  return out;
}

// Цена за штуку: вариант или цена блюда (у пиццы «от» — указанная, минимальная)
function unitPrice(r) { return r.variant ? r.variant.amount : effectivePrice(r.item).amount; }

// Название в корзине и заказе: с вариантом («Картофель фри, 300 г») или объёмом/весом («Coca-Cola, 1 л»)
function lineName(r) {
  if (r.variant) return fill(t('lineName'), { name: loc(r.item.name), variant: loc(r.variant.name) });
  const size = r.item.ml || r.item.grams ? portionText({ ml: r.item.ml, grams: r.item.grams }) : '';
  return size ? fill(t('lineName'), { name: loc(r.item.name), variant: size }) : loc(r.item.name);
}

// Итоги: позиций (штук), сумма, доставка, итого. mode — 'delivery' | 'pickup' | не задан (только сумма)
function cartTotals(mode) {
  let count = 0;
  let subtotal = 0;
  cartLines().forEach(function (x) {
    count += x.l.q;
    subtotal += unitPrice(x.r) * x.l.q;
  });
  let fee = 0;
  if (mode === 'delivery' && DELIVERY.fee > 0 && !(DELIVERY.freeFrom && subtotal >= DELIVERY.freeFrom)) fee = DELIVERY.fee;
  return { count: count, subtotal: subtotal, fee: fee, total: subtotal + fee };
}

// Изменить количество (0 — убрать) и перерисовать экран на месте; focusKey — какой кнопке вернуть фокус
function setQty(l, q, focusKey) {
  q = Math.min(CART_MAX, Math.max(0, q));
  let idx = -1;
  cart.forEach(function (x, k) { if (sameLine(x, l)) idx = k; });
  if (q === 0) {
    if (idx !== -1) cart.splice(idx, 1);
  } else if (idx === -1) {
    cart.push({ c: l.c, i: l.i, v: l.v || '', q: q });
  } else {
    cart[idx].q = q;
  }
  saveCart();
  redraw();
  if (focusKey) focusControl(focusKey);
}

// Фокус на ту же кнопку после перерисовки; её нет (например, «−» до нуля) — на соседнюю кнопку той же строки
function focusControl(key) {
  const nodes = document.querySelectorAll('#app [data-f]');
  const tail = key.slice(key.indexOf(':'));
  let found = null;
  for (let k = 0; k < nodes.length && !found; k++) if (nodes[k].getAttribute('data-f') === key) found = nodes[k];
  for (let k = 0; k < nodes.length && !found; k++) {
    const f = nodes[k].getAttribute('data-f');
    if (f.slice(f.indexOf(':')) === tail) found = nodes[k];
  }
  if (found) found.focus({ preventScroll: true });
}

// ─────────── Строка и карточка блюда ───────────
// ─────────── Фото ───────────
function photoName(map, key) { return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : ''; }

function photoSrc(name, suffix) { return 'photos/' + encodeURIComponent(name + suffix) + '.webp'; }

// Фото поверх рисунка (или на всю плитку): грузится лениво; не загрузилось — фото убирается, остаётся рисунок
function photoOver(box, src) {
  const img = el('img', 'fphoto');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.addEventListener('error', function () {
    if (img.parentNode) img.parentNode.removeChild(img);
    box.classList.remove('has-photo');
  });
  img.src = src;
  box.classList.add('has-photo');
  box.insertBefore(img, box.firstChild);
  return box;
}

// Картинка блюда: рисунок-заглушка, поверх — фото, если есть (mini — миниатюра для строки и корзины)
function dishPicture(cat, item, className, mini) {
  const box = illustration(item.illustration, className);
  const name = photoName(PHOTOS.i, cat.id + '/' + item.id);
  if (name) photoOver(box, photoSrc(name, mini ? '-m' : ''));
  return box;
}

// Фото разделов: плитки на главной (на всю плитку, название поверх на затемнении) и шапка категории
function homePhotos(screen) {
  const cards = screen.querySelectorAll('.cat-card');
  for (let k = 0; k < cards.length; k++) {
    const href = cards[k].getAttribute('href');
    const cat = priceData.categories.filter(function (c) { return catHash(c) === href; })[0];
    const name = cat ? photoName(PHOTOS.c, cat.id) : '';
    if (name) photoOver(cards[k], photoSrc(name, '-t'));
  }
}

const renderCategoryMenu = renderCategory;
renderCategory = function (screen, cat) {
  renderCategoryMenu(screen, cat);
  const name = photoName(PHOTOS.c, cat.id);
  const box = screen.querySelector('.screen-head .ill-big');
  if (name && box) photoOver(box, photoSrc(name, ''));
};

// «0,5 л» — литры с запятой
function formatLiters(ml) { return String(ml / 1000).replace('.', ','); }

// Кол-во и вес/объём: «10 шт.», «200 г», «0,5 л»
function portionText(item) {
  const parts = [];
  if (item.pieces) parts.push(fill(t('pieces'), { n: item.pieces }));
  if (item.grams) parts.push(fill(t('grams'), { n: item.grams }));
  if (item.ml) parts.push(item.ml >= 1000 || item.ml % 100 === 0 ? fill(t('liters'), { n: formatLiters(item.ml) }) : fill(t('ml'), { n: item.ml }));
  return parts.join(' · ');
}

// Кол-во и метки «Хит», «Острое», «Вег» (null, если ничего нет)
function dishMeta(item, tag) {
  const portion = portionText(item);
  if (!portion && !item.hit && !item.spicy && !item.veg) return null;
  const meta = el(tag || 'div', 'meta');
  if (portion) meta.appendChild(el('span', 'fport num', portion));
  if (item.hit) meta.appendChild(hitBadge());
  if (item.spicy) meta.appendChild(el('span', 'ftag ftag-spicy', t('spicy')));
  if (item.veg) meta.appendChild(el('span', 'ftag ftag-veg', t('veg')));
  return meta;
}

// Счётчик − N +
function stepper(l, q, name) {
  const key = lineKey(l);
  const box = el('div', 'stepper');
  const minus = el('button', 'step');
  minus.type = 'button';
  minus.setAttribute('aria-label', fill(t('minus'), { name: name }));
  minus.setAttribute('data-f', 'minus:' + key);
  minus.appendChild(svgNode(ICONS.minus));
  minus.addEventListener('click', function () { setQty(l, q - 1, 'minus:' + key); });
  const n = el('span', 'qty num', String(q));
  n.setAttribute('aria-live', 'polite');
  const plus = el('button', 'step');
  plus.type = 'button';
  plus.setAttribute('aria-label', fill(t('plus'), { name: name }));
  plus.setAttribute('data-f', 'plus:' + key);
  plus.disabled = q >= CART_MAX;
  plus.appendChild(svgNode(ICONS.plus));
  plus.addEventListener('click', function () { setQty(l, q + 1, 'plus:' + key); });
  box.appendChild(minus);
  box.appendChild(n);
  box.appendChild(plus);
  return box;
}

// Справа в строке: «+», счётчик (блюдо уже в корзине) или «+»-ссылка в карточку (у блюда варианты — сначала выбрать)
function rowControl(cat, item) {
  const name = loc(item.name);
  const box = el('div', 'fctl');
  if (itemVariants(item)) {
    const a = el('a', 'fadd');
    a.href = itemHash(cat, item);
    a.setAttribute('aria-label', fill(t('chooseIn'), { name: name }));
    a.title = a.getAttribute('aria-label');
    a.appendChild(svgNode(ICONS.plus));
    const n = cart.reduce(function (s, x) { return x.c === cat.id && x.i === item.id ? s + x.q : s; }, 0);
    if (n) a.appendChild(el('span', 'fcount num', String(n)));
    box.appendChild(a);
    return box;
  }
  const l = { c: cat.id, i: item.id, v: '' };
  const q = qtyOf(l);
  if (q) {
    box.appendChild(stepper(l, q, name));
  } else {
    const add = el('button', 'fadd');
    add.type = 'button';
    add.setAttribute('aria-label', fill(t('add'), { name: name }));
    add.title = add.getAttribute('aria-label');
    add.setAttribute('data-f', 'add:' + lineKey(l));
    add.appendChild(svgNode(ICONS.plus));
    add.addEventListener('click', function () { setQty(l, 1, 'plus:' + lineKey(l)); });
    box.appendChild(add);
  }
  return box;
}

// Строка блюда: картинка, название, состав, кол-во и метки, цена; справа «+» или счётчик
serviceRow = function (cat, item, withCategory) {
  const wrap = el('div', 'frow');
  const row = el('a', 'row');
  row.href = itemHash(cat, item);
  row.appendChild(dishPicture(cat, item, 'ill-mini', true));
  const info = el('div', 'info');
  info.appendChild(el('div', 'name', loc(item.name)));
  if (withCategory) info.appendChild(el('div', 'cat', loc(cat.name)));
  else if (item.desc && loc(item.desc)) info.appendChild(el('div', 'fdesc', loc(item.desc)));
  const meta = dishMeta(item);
  if (meta) info.appendChild(meta);
  info.appendChild(el('div', 'price num', formatPrice(effectivePrice(item))));
  row.appendChild(info);
  wrap.appendChild(row);
  wrap.appendChild(rowControl(cat, item));
  return wrap;
};

// Карточка блюда: фото или рисунок, цена, кол-во и метки, варианты, состав; внизу «Добавить» или счётчик и «Корзина»
renderItem = function (screen, cat, item, app) {
  screen.classList.add('screen-item');
  screen.appendChild(backLink(catHash(cat), 'c/' + cat.id, loc(cat.name)));
  screen.appendChild(iconButton('share', 'share-item', t('share'), function () { shareLink(cat, item); }));

  const card = el('article', 'card');
  card.appendChild(dishPicture(cat, item, 'ill-hero draw', false));
  const body = el('div', 'card-body');
  body.appendChild(el('h1', null, loc(item.name)));
  const variants = itemVariants(item);
  const key = cat.id + '/' + item.id;
  // У кафе вариант выбран сразу (первый), чтобы блюдо можно было добавить одним нажатием
  let chosen = variants ? variants[chosenVariants[key]] || variants[0] : null;
  const priceBig = el('p', 'price-big num', chosen ? variantPrice(item, chosen) : formatPrice(effectivePrice(item)));
  body.appendChild(priceBig);
  const meta = dishMeta(item, 'p');
  if (meta) body.appendChild(meta);
  if (variants) {
    body.appendChild(variantsBlock(cat, item, variants, chosen, function (v) {
      chosenVariants[key] = variants.indexOf(v);
      chosen = v;
      // Без перерисовки экрана (фокус остаётся на радиокнопке): только цена и нижняя кнопка
      priceBig.textContent = variantPrice(item, v);
      paintBar();
    }));
  }
  if (item.desc && loc(item.desc)) {
    body.appendChild(el('h2', null, t('composition')));
    body.appendChild(el('p', 'fcomp', loc(item.desc)));
  }
  card.appendChild(body);
  screen.appendChild(card);

  // Нижняя кнопка — вне анимируемого экрана, как у салонов
  const bar = el('div', 'book-bar fbar');
  function paintBar() {
    bar.textContent = '';
    const l = { c: cat.id, i: item.id, v: chosen ? String(chosen.id) : '' };
    const q = qtyOf(l);
    const inner = el('div', 'fbar-in');
    if (q) {
      inner.appendChild(stepper(l, q, chosen ? lineName({ item: item, variant: chosen }) : loc(item.name)));
      const go = el('a', 'btn-book');
      go.href = '#/cart';
      go.appendChild(svgNode(ICONS.cart));
      go.appendChild(el('span', 'num', fill(t('cartSum'), { sum: formatAmount(cartTotals().subtotal) })));
      inner.appendChild(go);
    } else {
      const add = el('button', 'btn-book');
      add.type = 'button';
      add.setAttribute('data-f', 'add:' + lineKey(l));
      add.appendChild(svgNode(ICONS.plus));
      add.appendChild(el('span', 'num', fill(t('addTo'), { price: chosen ? variantPrice(item, chosen) : formatPrice(effectivePrice(item)) })));
      add.addEventListener('click', function () { setQty(l, 1, 'plus:' + lineKey(l)); });
      inner.appendChild(add);
    }
    bar.appendChild(inner);
  }
  paintBar();
  app.appendChild(bar);

  document.title = loc(item.name) + ' · ' + company.name;
};

// ─────────── Экран корзины #/cart ───────────
const parseRouteMenu = parseRoute;
parseRoute = function (hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts.length === 1 && parts[0] === 'cart') return { screen: 'cart', key: 'cart' };
  return parseRouteMenu(hash);
};

// render() рисует неизвестный ему экран как главную — для #/cart вместо главной рисуется корзина
const renderHomeMenu = renderHome;
renderHome = function (screen) {
  if (currentRoute && currentRoute.screen === 'cart') renderCart(screen);
  else {
    renderHomeMenu(screen);
    homePhotos(screen);
  }
};

// Нижняя панель «N позиций · сумма» на главной и в категории (в поиске тоже — он на главной)
const renderMenu = render;
render = function (route, direction) {
  renderMenu(route, direction);
  if (route.screen !== 'home' && route.screen !== 'cat') return;
  const totals = cartTotals();
  if (!totals.count) return;
  const app = document.getElementById('app');
  app.querySelector('.screen').classList.add('has-fbar');
  const bar = el('div', 'book-bar fbar');
  if (!direction) bar.style.animation = 'none';
  const a = el('a', 'btn-book fcart');
  a.href = '#/cart';
  a.appendChild(svgNode(ICONS.cart));
  const badge = el('span', 'fcount num', String(totals.count));
  badge.setAttribute('aria-hidden', 'true'); // число уже есть в тексте «N позиций»
  a.appendChild(badge);
  a.appendChild(el('span', 'ftext num', fill(t('cartBar'), { count: formatCount(totals.count), sum: formatAmount(totals.subtotal) })));
  a.appendChild(el('span', 'fgo', t('cart')));
  a.appendChild(svgNode(ICONS.chev));
  bar.appendChild(a);
  app.appendChild(bar);
};

function renderCart(screen) {
  screen.classList.add('screen-item', 'food-cart');
  screen.appendChild(backLink('#/', 'home', t('categories')));
  screen.appendChild(el('h1', 'fh1', t('cart')));
  document.title = t('cart') + ' · ' + company.name;
  const lines = cartLines();
  if (!lines.length) {
    screen.appendChild(el('p', 'fempty', t('cartEmpty')));
    const a = el('a', 'btn-wa fto-menu', t('toMenu'));
    a.href = '#/';
    screen.appendChild(a);
    return;
  }
  const list = el('ul', 'list fcart-list');
  lines.forEach(function (x) {
    const name = lineName(x.r);
    const key = lineKey(x.l);
    const li = el('li', 'cline');
    const top = el('div', 'cline-top');
    top.appendChild(dishPicture(x.r.cat, x.r.item, 'ill-mini', true));
    // Название блюда, под ним мелко — вариант («16 шт.») или объём/вес («0,5 л»)
    const info = el('div', 'cinfo');
    const link = el('a', 'cname', loc(x.r.item.name));
    link.href = itemHash(x.r.cat, x.r.item);
    info.appendChild(link);
    const sub = x.r.variant ? loc(x.r.variant.name) : x.r.item.ml || x.r.item.grams ? portionText({ ml: x.r.item.ml, grams: x.r.item.grams }) : '';
    if (sub) info.appendChild(el('div', 'cvar num', sub));
    top.appendChild(info);
    const del = iconButton('trash', 'fremove', fill(t('remove'), { name: name }), function () { setQty(x.l, 0, null); });
    del.setAttribute('data-f', 'remove:' + key);
    top.appendChild(del);
    li.appendChild(top);
    const bottom = el('div', 'cline-bot');
    bottom.appendChild(el('span', 'cunit num', formatAmount(unitPrice(x.r))));
    bottom.appendChild(stepper(x.l, x.l.q, name));
    bottom.appendChild(el('span', 'csum num', formatAmount(unitPrice(x.r) * x.l.q)));
    li.appendChild(bottom);
    list.appendChild(li);
  });
  screen.appendChild(list);
  const clear = el('button', 'fclear', t('clearCart'));
  clear.type = 'button';
  clear.addEventListener('click', function () {
    if (!window.confirm(t('clearConfirm'))) return;
    cart = [];
    saveCart();
    redraw();
  });
  screen.appendChild(clear);
  if (lines.some(function (x) { return !x.r.variant && x.r.item.price.from; })) screen.appendChild(el('p', 'fsmall', t('fromNote')));
  checkout(screen);
}

// ─────────── Оформление заказа ───────────
// Способ получения, адрес и комментарий хранятся в localStorage — при следующем заказе не вводить заново
function loadOrder() {
  const o = storeGet(ORDER_KEY) || {};
  const text = function (v) { return typeof v === 'string' ? v.slice(0, 500) : ''; };
  return { mode: o.mode === 'pickup' && DELIVERY.pickup ? 'pickup' : 'delivery', address: text(o.address), comment: text(o.comment) };
}

let order = loadOrder();

function saveOrder() { storeSet(ORDER_KEY, order); }

// Принимаются ли сейчас заказы: рабочее время до delivery.untilTime (можно после полуночи), с учётом вчерашнего дня
function ordersOpen(date) {
  const hours = salonHours();
  if (!hours) return true;
  const until = DELIVERY.untilTime ? timeMinutes(DELIVERY.untilTime) : NaN;
  const today = salonToday(date);
  const min = salonClock(date).min;
  function within(day, m) {
    if (!day) return false;
    let end = day.close;
    if (!isNaN(until)) end = Math.min(until <= day.open ? until + 1440 : until, day.close);
    return m >= day.open && m < end;
  }
  return within(daySchedule(hours, today), min) || within(daySchedule(hours, addDays(today, -1)), min + 1440);
}

// Текст заказа для WhatsApp на текущем языке
function orderText(open) {
  const tot = cartTotals(order.mode);
  const out = [];
  if (!open) out.push(t('msgPre'));
  out.push(fill(t('msgHello'), { name: company.name }));
  cartLines().forEach(function (x, k) {
    out.push(fill(t('msgLine'), {
      n: k + 1,
      name: lineName(x.r) + (!x.r.variant && x.r.item.price.from ? t('msgSizeNote') : ''),
      qty: x.l.q,
      sum: formatAmount(unitPrice(x.r) * x.l.q)
    }));
  });
  out.push('');
  out.push(fill(t('msgSubtotal'), { sum: formatAmount(tot.subtotal) }));
  if (order.mode === 'delivery') out.push(fill(t('msgDelivery'), { sum: tot.fee ? formatAmount(tot.fee) : t('free') }));
  out.push(fill(t('msgTotal'), { sum: formatAmount(tot.total) }));
  out.push(t(order.mode === 'pickup' ? 'msgModePickup' : 'msgModeDelivery'));
  if (order.mode === 'delivery' && order.address.trim()) out.push(fill(t('msgAddress'), { text: order.address.trim() }));
  if (order.comment.trim()) out.push(fill(t('msgComment'), { text: order.comment.trim() }));
  return out.join('\n');
}

// Поле ввода с подписью
function textField(id, label, hint, value, onInput) {
  const box = el('div', 'ffield');
  const lab = el('label', null, label);
  lab.htmlFor = id;
  const area = el('textarea');
  area.id = id;
  area.rows = 2;
  area.maxLength = 500;
  area.placeholder = hint;
  area.value = value;
  area.addEventListener('input', function () { onInput(area.value); });
  box.appendChild(lab);
  box.appendChild(area);
  return box;
}

function checkout(screen) {
  const sec = el('section', 'fcheckout');
  if (DELIVERY.pickup) {
    const modes = el('fieldset', 'variants fmode');
    modes.appendChild(el('legend', null, t('howToGet')));
    const opts = el('div', 'opts');
    const labels = [];
    ['delivery', 'pickup'].forEach(function (m) {
      const label = el('label', 'opt');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'fmode';
      input.value = m;
      input.checked = order.mode === m;
      if (input.checked) label.classList.add('is-checked');
      input.addEventListener('change', function () {
        if (!input.checked) return;
        labels.forEach(function (x) { x.classList.toggle('is-checked', x === label); });
        order.mode = m;
        saveOrder();
        paint();
      });
      label.appendChild(input);
      label.appendChild(el('span', 'vname', t(m === 'pickup' ? 'modePickup' : 'modeDelivery')));
      labels.push(label);
      opts.appendChild(label);
    });
    modes.appendChild(opts);
    sec.appendChild(modes);
  } else {
    sec.appendChild(el('h2', 'fh2', t('modeDelivery')));
  }
  const addr = textField('f-address', t('address'), t('addressHint'), order.address, function (v) {
    order.address = v;
    saveOrder();
    paint();
  });
  addr.querySelector('textarea').setAttribute('autocomplete', 'street-address');
  sec.appendChild(addr);
  const note = company.deliveryNote && loc(company.deliveryNote) ? el('p', 'fsmall', loc(company.deliveryNote)) : null;
  if (note) sec.appendChild(note);
  const pickup = el('p', 'fpickup', fill(t('pickupFrom'), { address: loc(company.address) }));
  sec.appendChild(pickup);
  sec.appendChild(textField('f-comment', t('comment'), t('commentHint'), order.comment, function (v) {
    order.comment = v;
    saveOrder();
    paint();
  }));
  const sum = el('dl', 'fsum');
  sec.appendChild(sum);
  const toFree = el('p', 'fsmall');
  sec.appendChild(toFree);
  const warn = el('p', 'fwarn');
  sec.appendChild(warn);
  if (company.paymentNote && loc(company.paymentNote)) sec.appendChild(el('p', 'fsmall', loc(company.paymentNote)));
  screen.appendChild(sec);

  const app = document.getElementById('app');
  const bar = el('div', 'book-bar fbar');
  app.appendChild(bar);

  function sumRow(label, value, className) {
    const row = el('div', className);
    row.appendChild(el('dt', null, label));
    row.appendChild(el('dd', 'num', value));
    sum.appendChild(row);
  }

  // Итоги, подсказки и кнопка заказа — без перерисовки экрана (фокус остаётся в поле ввода)
  function paint() {
    const delivery = order.mode === 'delivery';
    addr.hidden = !delivery;
    if (note) note.hidden = !delivery;
    pickup.hidden = delivery;
    const tot = cartTotals(order.mode);
    sum.textContent = '';
    sumRow(t('subtotal'), formatAmount(tot.subtotal));
    if (delivery) sumRow(t('deliveryFee'), tot.fee ? formatAmount(tot.fee) : t('free'));
    sumRow(t('total'), formatAmount(tot.total), 'ftotal');
    toFree.textContent = delivery && tot.fee && DELIVERY.freeFrom ? fill(t('toFree'), { sum: formatAmount(DELIVERY.freeFrom - tot.subtotal) }) : '';
    toFree.hidden = !toFree.textContent;
    const open = ordersOpen(new Date());
    warn.textContent = open ? '' : fill(t('preorderWarn'), { time: DELIVERY.untilTime || '' });
    warn.hidden = open;

    let block = '';
    if (tot.subtotal < DELIVERY.min) block = fill(t('toMin'), { sum: formatAmount(DELIVERY.min - tot.subtotal) });
    else if (delivery && !order.address.trim()) block = t('needAddress');
    bar.textContent = '';
    if (block) {
      const hint = el('p', 'fbar-hint num', block);
      hint.id = 'f-block';
      bar.appendChild(hint);
      const btn = el('button', 'btn-book');
      btn.type = 'button';
      btn.disabled = true;
      btn.setAttribute('aria-describedby', 'f-block');
      btn.appendChild(svgNode(ICONS.whatsapp));
      btn.appendChild(el('span', null, t(open ? 'order' : 'preorder')));
      bar.appendChild(btn);
    } else {
      const go = externalLink('btn-book', waLink(orderText(open)));
      go.appendChild(svgNode(ICONS.whatsapp));
      go.appendChild(el('span', null, t(open ? 'order' : 'preorder')));
      bar.appendChild(go);
    }
  }
  paint();
}

init();
